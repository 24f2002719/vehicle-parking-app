{% extends 'base.html' %}
{% block title %}Users{% endblock %}

{% block content %}
<div class="container py-4">

  


  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h5 class="mb-0 text-primary text-center mb-2 mt-2">
        <i class="bi bi-people-fill me-2"></i>Registered Users
      </h5>
    </div>

    <div class="card-body p-2">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-2 align-middle table-bordered">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>Full Name</th>
              <th>Address</th>
              <th>Pin Code</th>
            </tr>
          </thead>
          <tbody class="table-group-divider">
            {% for user in users %}
              <tr>
                <td>{{ loop.index }}</td>
                <td>{{ user.user_email }}</td>
                <td>{{ user.user_name }}</td>
                <td>{{ user.user_address }}</td>
                <td>{{ user.user_pincode }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
{% endblock %}
