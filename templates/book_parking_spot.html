{% extends 'base.html' %}
{% block title %}Book Parking Lot{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-3 shadow-sm w-100" style="max-width: 500px;">
        
        <h3 class="text-center mb-2">Book Parking Lot</h3>
    
        <form method="POST" action={{ url_for('book_parking_spot', lot_id=parking_lot.id )}}>
            
            
            <div class="mb-2">
                <label for="spot_id" class="form-label">Spot ID:  </label>
                <input type="text" class="form-control" id="spot_id" name="spot_id" value="{{ spot.id }}" readonly>
            </div>

            <div class="mb-2">
                <label for="lot_id" class="form-label">Lot ID:  </label>
                <input type="text" class="form-control" id="lot_id" name="lot_id" value="{{ parking_lot.spot.lot_id }}" readonly>
            </div>
            <div class="mb-2">
                <label for="user_id" class="form-label">User ID:  </label>
                <input type="text" class="form-control" id="user_id" name="user_id" value="{{ session.get('user_id') }}" readonly>
            </div>
            
            <div class="mb-2">
                <label for="parking_cost" class="form-label">Parking Cost(Per Hour):  </label>
                <input type="text" class="form-control" id="parking_cost" name="parking_cost" value="{{ parking_lot.price }}" readonly>
            </div>
            
            <div class="mb-2">
                <label for="vehicle_no" class="form-label">Vehicle Number:  </label>
                <input type="text" class="form-control" id="vehicle_no" name="vehicle_no" placeholder="Enter your vehicle number">
            </div>    

            <div class="mb-2">
                <label for="parking_timestamp" class="form-label">Parking Time:  </label>
                <input type="datetime-local" class="form-control" id="parking_timestamp" name="parking_timestamp" value="{{ parking_timestamp }}">
            </div> 
            

            <div class="mb-2">
                <label for="duration" class="form-label">Duration (in hours):  </label>
                <input type="number" class="form-control" id="duration" name="duration" placeholder="Enter duration in hours">
            
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Book</button>
            </div>
            <div class="d-grid mt-2">
                <a href="{{ url_for('home') }}" class="btn btn-danger">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
