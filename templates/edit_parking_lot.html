{% extends 'base.html' %}
{% block title %}Edit Parking Lot{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-3 shadow-sm w-100 rounded-4" style="max-width: 500px;">
    <h3 class="text-center mb-4">Edit Parking Lot</h3>

    <form method="POST" action={{ url_for('edit_parking_lot', parking_lot_id=parking_lot.id) }}>

      <div class="mb-2">
        <label for="location" class="form-label">Prime Location Name : </label>
        <input type="text" class="form-control" id="location" name="location" placeholder="Enter location"
          value="{{ parking_lot.prime_location_name }}">
      </div>

      <div class="mb-2">
        <label for="address" class="form-label">Address: </label>
        <input class="form-control" id="address" name="address" placeholder="Enter your address" rows="2"
          value="{{ parking_lot.address }}"></input>
      </div>
      <div class="mb-2">
        <label for="pincode" class="form-label">Pincode: </label>
        <input type="text" class="form-control" id="pincode" name="pincode" placeholder="Enter pincode"
          value="{{ parking_lot.pincode }}">
      </div>
      <div class="mb-2">
        <label for="price" class="form-label">Price (per hour): </label>
        <input type="text" class="form-control" id="price" name="price" placeholder="Enter Price"
          value="{{ parking_lot.price }}">
      </div>
      <div class="mb-2">
        <label for="max_spots" class="form-label">Maximum Spots: </label>
        <input type="text" class="form-control" id="max_spots" name="max_spots" placeholder="Enter maximum spots"
          value="{{ parking_lot.maximum_number_of_spots }}">
      </div>

      <div class="d-grid mb-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i>Update
        </button>
      </div>
      <div class="d-grid">
        <a href="{{ url_for('home') }}" class="btn btn-danger">
          <i class="bi bi-x-circle me-1"></i>Cancel
        </a>
      </div>



    </form>

  </div>
</div>
{% endblock %}
