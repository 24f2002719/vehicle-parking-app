{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-3 shadow-sm w-100 rounded-4" style="max-width: 500px;">
        <h3 class="text-center mb-4">Edit Profile</h3>
            
        <form method="POST" action={{ url_for('edit_profile', user_id=user.user_id) }}>
            
            <div class="mb-2">
                <label for="name" class="form-label">Full Name :  </label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter Full Name" value="{{ user.user_name }}">
            </div>

            <div class="mb-2">
                <label for="address" class="form-label">Address: </label>
                <input class="form-control" id="address" name="address" placeholder="Enter your address" value="{{ user.user_address }}"></input>
            </div>
            <div class="mb-2">
                <label for="pincode" class="form-label">Pincode: </label>
                <input type="text" class="form-control" id="pincode" name="pincode" placeholder="Enter pincode" value="{{ user.user_pincode }}">
            </div>
            
            <div class="d-grid mb-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>Submit
          </button>
        </div>
        <div class="d-grid">
          <a href="{{ url_for('home') }}" class="btn btn-danger">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </a>
        </div>


        </form>
        
    </div>
</div>
{% endblock %}
