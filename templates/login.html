{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center ">
  <div class="card p-4 shadow-sm w-100" style="max-width: 400px;">
    <h3 class="text-center mb-4">Login</h3>
    <form method="POST" action="/login" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Registered Email ID: </label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password: </label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" aria-describedby="passwordHelpBlock" required>
        <div id="passwordHelpBlock" class="form-text">
          Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.
        </div>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>
    </form>
    <div class="text-center mt-3">
      <p>Don't have an account?</p>
      <a href="/signup" class="btn btn-secondary">Sign Up</a>
    </div>
  </div>
</div>
{% endblock %}
